name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run size

  # The package declares `vue: ^3.2.0`. Build once with the current Vue,
  # then run the unit tests against the built package with older runtimes.
  vue-compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        vue: ['3.2.47', '3.3.13', '3.4.38', 'latest']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save vue@${{ matrix.vue }}
      - run: npx vitest run --project unit
        env:
          TEST_DIST: '1'
